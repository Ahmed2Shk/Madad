# Keeps the free Supabase project awake: it pauses after a week without activity (SPEC §12).
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY (the public anon key, never service_role).
name: keepalive

on:
  schedule:
    - cron: '17 6 */3 * *' # every 3 days
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one public setting
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set; nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/settings?select=key&key=eq.fresh_hours" > /dev/null
          echo "Supabase answered."
