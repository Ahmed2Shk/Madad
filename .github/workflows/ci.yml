name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: supabase/seed.sql matches the JSON seeds
        run: node scripts/build-seed.mjs && git diff --exit-code supabase/seed.sql
      - run: npm test
      - run: npm run build
      - run: npm run size
