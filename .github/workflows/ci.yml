name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: supabase/seed.sql and seed-live.sql match the JSON seeds
        run: node scripts/build-seed.mjs && node scripts/build-live-seed.mjs && git diff --exit-code supabase/seed.sql supabase/seed-live.sql
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: Playwright (search, quick update, accessibility)
        run: npx playwright install --with-deps chromium && npm run e2e
